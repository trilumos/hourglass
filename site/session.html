<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustain — Session</title>
<style>
  /* Self-hosted, overlap-REMOVED static weights (fontTools removeOverlaps). This is why the outline
     (-webkit-text-stroke) traces ONLY the true glyph boundary — no variable-font internal seam lines. */
  @font-face{font-family:'Jost';font-weight:400;font-display:swap;src:url('assets/fonts/jost-400.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:500;font-display:swap;src:url('assets/fonts/jost-500.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:550;font-display:swap;src:url('assets/fonts/jost-550.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:600;font-display:swap;src:url('assets/fonts/jost-600.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:700;font-display:swap;src:url('assets/fonts/jost-700.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:400;font-display:swap;src:url('assets/fonts/newsreader-400.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:500;font-display:swap;src:url('assets/fonts/newsreader-500.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:550;font-display:swap;src:url('assets/fonts/newsreader-550.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:600;font-display:swap;src:url('assets/fonts/newsreader-600.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:700;font-display:swap;src:url('assets/fonts/newsreader-700.woff2') format('woff2')}
  :root{
    --plate: url("assets/plates/midday.jpg");
    --num-font: 'Newsreader', serif;
    --num-weight: 500;
    --num-color: #ffffff;
    --num-eff: #ffffff;   /* effective colour = --num-color lifted toward white on dark plates (setTone) */
    --num-size: 34;          /* in cqh, applied to the scene box */
    --num-scaleX: 1;
    --dx: 0px; --dy: 0px;    /* drag offset for the number block */
    --gap: 1.5cqw;           /* inline digit spacing (mm : ss) */
    --frost-bg:#35353566;    /* Setup's frost material — identical */
    --ink:#f2ecdd;           /* Setup's ink colour — used by the #gear icon + done-card text (Task 5) */
  }
  /* Parallax removed per founder decision — bg/fg stay static; only the numbers (#nums) move,
     via drag (--dx/--dy). Occluders (.fg-glass/.fg-horizon/.fg-ledge) are static masked copies
     of the same plate, so they can never desync from the (also static) background. */
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ height:100%; background:#05080d; overflow:hidden;
    font-family:'Jost',system-ui,sans-serif; color:#e7ecf3 }

  /* ---- SITE-WIDE LOCKED PLATE RULE — identical to Home & Setup: the plate FILLS the viewport,
       background cover, position 50% 50% (= object-fit:cover; object-position:50% 50%). No letterbox,
       no transform, no zoom. The plate's fit/position/zoom must never deviate across the three pages. */
  #stage{ position:fixed; inset:0; container-type:size; overflow:hidden }
  #scene{ position:absolute; inset:0; container-type:size; overflow:hidden }
  .layer{ position:absolute; inset:0; width:100%; height:100%;
    background:var(--plate) center/cover no-repeat; pointer-events:none }
  .bg{ z-index:0 }

  /* ---- numbers live BETWEEN bg and the foreground occluders ---- */
  #nums{ position:absolute; inset:0; z-index:1; touch-action:none; will-change:transform;
    transform:translate3d(var(--dx,0px),var(--dy,0px),0);
    transition:opacity .5s ease }
  .num{ position:absolute; left:50%; top:50%; line-height:1; white-space:nowrap;
    text-box:trim-both cap alphabetic;   /* centre by cap-height/baseline → font-metric-independent */
    font-family:var(--num-font); font-weight:var(--num-weight);
    font-size:calc(var(--num-size)*1cqh); color:var(--num-eff,var(--num-color));
    -webkit-text-fill-color:var(--num-eff,var(--num-color));
    transform:translate(-50%,-50%) scaleX(var(--num-scaleX));
    font-variant-numeric:tabular-nums; letter-spacing:-.01em }

  /* ---- foreground occluders: plate-copies masked to the occluding shape ---- */
  .fg{ z-index:2; opacity:0; transition:opacity .25s ease }
  .fg.active{ opacity:1 }
  /* ledge = bottom ~11.3% of the plate, a straight cut */
  .fg-ledge{ -webkit-mask-image:linear-gradient(to top,#000 0 11.3%,transparent 11.3%);
             mask-image:linear-gradient(to top,#000 0 11.3%,transparent 11.3%) }
  /* hourglass = real silhouette matte (segmentation-extracted from the plate) */
  .fg-glass{ -webkit-mask-image:url(assets/hourglass-matte.png); mask-image:url(assets/hourglass-matte.png);
             -webkit-mask-size:cover; mask-size:cover;
             -webkit-mask-position:center; mask-position:center;
             -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  /* horizon = founder's flat sea-horizon matte, opaque below ~55% */
  .fg-horizon{ -webkit-mask-image:url(assets/skyline-matte.png); mask-image:url(assets/skyline-matte.png);
             -webkit-mask-size:cover; mask-size:cover;
             -webkit-mask-position:center; mask-position:center;
             -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }

  /* ================= FILLS ================= */
  #scene[data-fill="solid"] .num{     /* colour lifts toward white on dark plates (setTone); a subtle
       dark drop grounds it on bright plates */
    text-shadow:0 1px 2px rgb(0 0 0 / 32%), 0 2px 22px rgb(0 0 0 / 20%) }
  #scene[data-fill="glass"] .num{      /* translucent liquid-glass */
    color:rgba(255,255,255,.26); -webkit-text-fill-color:rgba(255,255,255,.26);
    -webkit-text-stroke:1px rgba(255,255,255,.5);
    text-shadow:0 1px 1px rgba(255,255,255,.35), 0 6px 34px rgba(0,0,0,.28) }
  #scene[data-fill="outline"] .num{      /* hollow border (overlap-removed static fonts); stroke lifts at night */
    color:transparent; -webkit-text-fill-color:transparent;
    -webkit-text-stroke:1.5px var(--num-eff,var(--num-color)); text-shadow:none; paint-order:stroke }

  /* ================= SEPARATOR (sectioning between mm and ss) ================= */
  #sep::before{ content:":" }                                      /* colon (default) */
  #scene[data-sep="dot"]  #sep::before{ content:"·" }              /* middle dot */
  #scene[data-sep="none"] #sep{ display:none }                     /* gap only */
  #scene[data-sep="line"] #sep::before{ content:""; display:inline-block; align-self:center;
    width:.08em; height:.58em; border-radius:99px; background:var(--num-color) }   /* hairline rule */

  /* ================= PLACEMENTS — 4 modes; only vertical position (--tb-top) differs =================
     mm anchored right-of-centre, ss anchored left-of-centre, sep floated dead-centre. So the position
     is INDEPENDENT of font width AND separator choice — a wider font just extends outward, and the
     inner edges stay put. --gap = half-gap (distance from centre to each inner edge). */
  .tb{ position:absolute; inset:0 }
  /* centre axis = --hg-cx: the HOURGLASS axis (49% = its posts' midpoint) for Top/Middle/Ledge so the
     flanking numbers are symmetric to the GLASS, not the plate. Horizon keeps 50% (it's free-dragged). */
  #mm{ right:calc((100% - var(--hg-cx,50%)) + var(--gap)); left:auto; top:var(--tb-top,50%);
       transform:translateY(-50%) scaleX(var(--num-scaleX)) }
  #ss{ left:calc(var(--hg-cx,50%) + var(--gap));  right:auto; top:var(--tb-top,50%);
       transform:translateY(-50%) scaleX(var(--num-scaleX)) }
  #sep{ left:var(--hg-cx,50%); right:auto; top:var(--tb-top,50%);
        transform:translate(-50%,-50%) scaleX(var(--num-scaleX)) }
  #scene[data-place="top"]     { --tb-top:15%; --hg-cx:49.79% }   /* X locked to the hourglass axis */
  #scene[data-place="middle"]  { --tb-top:48%; --hg-cx:49.79% }
  #scene[data-place="horizon"] { --tb-top:55% }
  #scene[data-place="ledge"]   { --tb-top:78%; --hg-cx:49.79% }

  /* ================= VISIBILITY ================= */
  #scene[data-vis="hover"] #nums{ opacity:0 }
  #scene[data-vis="hover"]:hover #nums{ opacity:1 }
  #scene[data-vis="flash"] #nums{ animation:flash 12s ease-in-out infinite }
  @keyframes flash{ 0%,78%,100%{opacity:0} 84%,94%{opacity:1} }
  @media (prefers-reduced-motion:reduce){
    .bg,#nums,.fg{ transform:none !important }
    #scene[data-vis="flash"] #nums{ animation:none; opacity:1 } }

  /* ================= CONTROLS (Task 5) — Setup's frost material, reused verbatim ================= */
  /* .frost copied byte-for-byte from setup.html (~L89) — the one shared frost material. */
  .frost{
    background:var(--frost-bg);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow: inset 0 0 4px -2px #ffffff55, 0 0 4px -2px #ffffff55,
                0 22px 55px rgba(0,0,0,.34);
    border:1px solid rgba(255,255,255,.06);
  }
  @media (prefers-reduced-transparency: reduce){
    .frost{ background:#1a1d26f2; -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  /* bottom-centre bar — .frost paints it; position/pill-radius mirrors Setup's floating
     .begin button (~L377): same anchor, same radius, the same "last calm decision" placement. */
  #controls{
    position:absolute; left:50%; bottom:clamp(20px,4.5cqh,52px); transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:.3em; border-radius:100px; padding:.35em;
  }
  #controls button{
    font-family:inherit; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
    font-size:clamp(10px,1.05cqi,14px); color:#fff; cursor:pointer;
    padding:1.05em 2.2em; border-radius:100px; border:none; background:none;
    transition:background .2s;
  }
  #controls button:hover{ background:rgba(255,255,255,.14); }
  /* top-right icon button — .frost paints it; shape/position mirrors Setup's .backbtn
     (~L100), mirrored to the opposite corner. Click (settings panel) is wired in Task 7. */
  #gear{
    position:absolute; right:clamp(14px,2.4cqi,46px); top:clamp(14px,2.4cqi,46px); z-index:5;
    width:clamp(34px,3cqi,46px); aspect-ratio:1; border-radius:50%;
    color:var(--ink); font-size:clamp(14px,1.3cqi,20px); line-height:1; cursor:pointer;
    border:none; display:flex; align-items:center; justify-content:center;
  }

  /* chrome fade-when-idle — #controls/#gear ONLY. Kept fully separate from S.dataset.vis
     (Task 4's number-visibility) and from #done (a modal — exempt, never opacity-governed here). */
  #controls,#gear{ opacity:0; transition:opacity .4s }
  body.active #controls, body.active #gear{ opacity:1 }

  /* done-state overlay — dim scrim + a centred .frost card (Setup's material, not a new one).
     Fully visible whenever shown; the idle-fade rule above never touches it. */
  #done{ position:absolute; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    background:rgba(4,6,12,.5); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #done[hidden]{ display:none }
  .donecard{ padding:clamp(28px,4.5cqi,48px) clamp(32px,6cqi,64px); border-radius:clamp(20px,2.4cqi,32px);
    text-align:center }
  .donecard-total{ font-size:clamp(15px,1.6cqi,20px); font-weight:400; color:var(--ink); margin-bottom:1.6em }
  .donecard-btns{ display:flex; gap:1em; justify-content:center }
  .donecard-btns button{
    font-family:inherit; font-weight:500; letter-spacing:.15em; text-transform:uppercase;
    font-size:clamp(10px,1.05cqi,14px); color:#fff; cursor:pointer; padding:.9em 2em;
    border-radius:100px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1);
    transition:background .2s;
  }
  .donecard-btns button:hover{ background:rgba(255,255,255,.17) }

  /* ================= SEGMENT LABEL + ENDLESS FLIP (Task 6) ================= */
  /* transition toast — Setup's frost material, reused; fades in on a segment change, auto-fades ~2s later */
  #seglabel{
    position:absolute; left:50%; top:clamp(20px,6cqh,56px); transform:translateX(-50%); z-index:4;
    padding:.7em 1.6em; border-radius:100px; pointer-events:none;
    font-family:inherit; font-weight:500; letter-spacing:.15em; text-transform:uppercase;
    font-size:clamp(10px,1.05cqi,14px); color:var(--ink);
    opacity:0; transition:opacity .4s;
  }
  #seglabel.show{ opacity:1 }
  /* full-screen fade-through-black for Endless's user-triggered "flip" (reset the count, no sand anim in v1) */
  #flip{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .5s; z-index:7 }
</style>
</head>
<body>
<div id="stage"><div id="scene" data-fill="solid">
  <div class="layer bg"></div>
  <div id="nums"><span class="tb">
    <span class="num" id="mm">25</span><span class="num" id="sep"></span><span class="num" id="ss">00</span>
  </span></div>
  <div class="layer fg fg-glass"></div>
  <div class="layer fg fg-horizon"></div>
  <div class="layer fg fg-ledge"></div>
</div>
<div id="seglabel" class="frost"></div>
<div id="flip"></div>
<button id="gear" class="frost" aria-label="Settings">⚙</button>
<div id="controls" class="frost"><button id="pause">Pause</button><button id="flipBtn" hidden>Flip</button><button id="end">End</button></div>
<div id="done" hidden>
  <div class="frost donecard">
    <p class="donecard-total">Focused <b id="doneMin">0m</b> today</p>
    <div class="donecard-btns"><button id="again">Again</button><button id="doneEnd">End</button></div>
  </div>
</div>
</div>
<script src="js/plan.js"></script>
<script src="js/session-timer.js"></script>
<script>
(function () {
  var S = document.getElementById('scene'), mm = document.getElementById('mm'), ss = document.getElementById('ss');
  var cfg = JSON.parse(localStorage.getItem('sustain.session') || 'null')
         || { mode:'flow', flowMin:25, place:'middle', phase:2, sounds:[], vol:100, sep:'none', font:"'Newsreader',serif", color:'#ffffff', vis:'always', followDay:true, autoContrast:true };
  var plan = Plan.buildPlan(cfg);
  var timer = SessionTimer.create(plan, { endless: cfg.mode === 'endless' });
  timer.start();
  var fmt2 = function (n) { return String(n).padStart(2,'0'); };

  // Task 7 contract: the ported audio engine assigns its live AudioContext here
  // (sharedCtx = <engine ctx>) so softCue() below becomes audible. Until then it stays
  // null and softCue no-ops silently (no throw) — expected pre-Task-7 behaviour.
  var sharedCtx = null;

  // ================= controls (Task 5) — pause/resume, end, done-state, focusedToday =================
  var focusMin = Plan.totalFocusOf(plan), shownDone = false, lastSegIndex = 0;
  var doneEl = document.getElementById('done'), doneMinEl = document.getElementById('doneMin');
  function bumpFocusedToday(min) {
    var k = 'sustain.focusedToday', today = new Date().toDateString();
    var o = JSON.parse(localStorage.getItem(k) || 'null');
    if (!o || o.date !== today) o = { date: today, min: 0 };
    o.min += min;
    localStorage.setItem(k, JSON.stringify(o));
  }
  function endSession() { location.href = 'setup.html'; }

  // gentle sine blip at each focus↔rest boundary — see the sharedCtx contract above; a plain
  // no-op until Task 7 assigns a live AudioContext
  function softCue(kind) {
    if (sharedCtx == null) return;
    sharedCtx.resume();
    var now = sharedCtx.currentTime;
    var osc = sharedCtx.createOscillator(), gain = sharedCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = kind === 'rest' ? 440 : 660;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.2);
    gain.gain.linearRampToValueAtTime(0, now + 0.4);
    osc.connect(gain).connect(sharedCtx.destination);
    osc.start(now); osc.stop(now + 0.4);
  }

  var seglabelEl = document.getElementById('seglabel'), seglabelT = null;
  function showSegLabel(text) {
    seglabelEl.textContent = text;
    seglabelEl.classList.add('show');
    clearTimeout(seglabelT);
    seglabelT = setTimeout(function () { seglabelEl.classList.remove('show'); }, 2000);
  }

  function tick() {
    var p = timer.progress();
    var totalSec = cfg.mode === 'endless' ? Math.floor(p.elapsedMs/1000) : Math.ceil(p.remainingMs/1000);
    mm.textContent = fmt2(Math.floor(totalSec/60) % 100);
    ss.textContent = fmt2(totalSec % 60);
    if (!p.done && p.segIndex !== lastSegIndex) {   // segment auto-advance — guarded so it never fires at t=0 or on done
      softCue(p.kind);
      showSegLabel(p.kind === 'rest' ? 'Break · ' + Plan.fmt(plan[p.segIndex].min) : 'Focus');
      lastSegIndex = p.segIndex;
    }
    if (p.done && !shownDone) {          // endless mode never reaches here — progress().done stays false forever
      shownDone = true;
      bumpFocusedToday(focusMin);
      doneMinEl.textContent = Plan.fmt(focusMin);
      doneEl.hidden = false;
    }
  }
  tick(); setInterval(tick, 250);   // 250ms so the seconds flip crisply; engine is wall-clock, not tick-accumulated

  var pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', function () {
    if (timer.isPaused()) { timer.resume(); pauseBtn.textContent = 'Pause'; }
    else { timer.pause(); pauseBtn.textContent = 'Resume'; }
  });
  document.getElementById('end').addEventListener('click', endSession);
  document.getElementById('doneEnd').addEventListener('click', endSession);
  document.getElementById('again').addEventListener('click', function () {
    timer = SessionTimer.create(plan, { endless: cfg.mode === 'endless' });
    timer.start();
    shownDone = false;
    lastSegIndex = 0;
    doneEl.hidden = true;
  });
  // #gear: click intentionally unwired — the settings panel it opens is Task 7.

  // ================= Endless fade-flip (Task 6) — user-triggered reset, fade through black =================
  function fadeFlip(reset) {
    var f = document.getElementById('flip');
    f.style.opacity = '1';
    setTimeout(function () { reset(); f.style.opacity = '0'; }, 500);
  }
  if (cfg.mode === 'endless') {
    var flipBtn = document.getElementById('flipBtn');
    flipBtn.hidden = false;
    flipBtn.addEventListener('click', function () {
      fadeFlip(function () {
        timer = SessionTimer.create(plan, { endless: true });
        timer.start();
        lastSegIndex = 0;
      });
    });
  }

  // chrome fade-when-idle — #controls/#gear ONLY. Kept separate from S.dataset.vis (Task 4's
  // number-visibility) and from #done (a modal — never governed by this).
  var idleT = null;
  function wake() {
    document.body.classList.add('active');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.remove('active'); }, 3000);
  }
  window.addEventListener('pointermove', wake);
  window.addEventListener('touchstart', wake, { passive: true });
  wake();

  // ================= number treatment — ported VERBATIM from web-prototype/number-lab.html =================
  // (founder-LOCKED design; logic not re-derived, only paths/vars adapted for site/ + cfg-driven wiring)

  // PHASES/withHG plate helper (lab ~281-287). Only with-hourglass plates exist under site/assets/plates/,
  // and v1 has no hourglass on/off toggle — the wooden hourglass is the scene hero, always shown.
  var PHASES = ['pre-dawn', 'sunrise', 'midday', 'sunset', 'twilight', 'midnight'];
  function withHG(i) { return 'assets/plates/' + PHASES[i] + '.jpg'; }
  function setPlate() {
    document.documentElement.style.setProperty('--plate', 'url("' + withHG(phase) + '")');
    sampleBg();   // re-sample bg luminance for auto-contrast
  }

  // phase resolver (brief Step 2, verbatim): local clock hour -> phase index when cfg.followDay
  function phaseFromClock() {
    var h = new Date().getHours();
    return h < 5 ? 0 : h < 8 ? 1 : h < 16 ? 2 : h < 19 ? 3 : h < 21 ? 4 : 5;
  }
  var phase = cfg.followDay ? phaseFromClock() : (cfg.phase | 0);

  // occluders are position-specific (lab refreshFG, ~292-296). Depth-toggle and hourglass-toggle dropped —
  // neither exists in session v1 (no settings UI yet, hourglass always in-scene) — occlusion is just always on.
  function refreshFG() {
    var place = S.dataset.place;
    document.querySelector('.fg-glass').classList.add('active');
    document.querySelector('.fg-horizon').classList.toggle('active', place === 'horizon');
    document.querySelector('.fg-ledge').classList.remove('active');   // Ledge: numbers rest ON the ledge (no depth)
  }

  // locked per-mode geometry (lab LOCKED, ~382-387) — byte-for-byte site/js/timer-modes.json / web-prototype/timer-modes.json
  var LOCKED = {
    horizon: { xPct: -30, yPct: -4.2,  size: '20', gap: '3cqw',  weight: '550', stretch: '1' },
    middle:  { xPct: 0,   yPct: 4.84,  size: '25', gap: '15cqw', weight: '550', stretch: '1' },
    top:     { xPct: 0,   yPct: -2.59, size: '25', gap: '3cqw',  weight: '550', stretch: '1' },
    ledge:   { xPct: 0,   yPct: 11.96, size: '25', gap: '15cqw', weight: '550', stretch: '1' }
  };
  // lab applyMode (~391-402), minus slider-sync + tuned-preset fallback — no authoring controls in the session
  function applyMode(mode) {
    var p = LOCKED[mode]; if (!p) return;
    var r = S.getBoundingClientRect();
    S.style.setProperty('--num-size', p.size);
    S.style.setProperty('--gap', p.gap);
    S.style.setProperty('--num-weight', p.weight);
    S.style.setProperty('--num-scaleX', p.stretch);
    S.style.setProperty('--dx', (mode === 'horizon' ? p.xPct / 100 * r.width : 0) + 'px');
    S.style.setProperty('--dy', p.yPct / 100 * r.height + 'px');
  }

  // auto-contrast (lab rgbOf/setTone/sampleBg, ~414-438, verbatim — overall-luminance version)
  var bgLuma = 0.5, autoContrast = !!cfg.autoContrast, liftK = 1;
  function rgbOf(c) {
    c = (c || '#ffffff').trim(); var r = 255, g = 255, b = 255;
    if (c[0] === '#') {
      var h = c.slice(1); if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join('');
      r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
    } else { var m = c.match(/\d+/g); if (m) { r = +m[0]; g = +m[1]; b = +m[2]; } }
    return [r, g, b];
  }
  function setTone() {
    var chosen = getComputedStyle(S).getPropertyValue('--num-color').trim();
    if (!autoContrast) { S.style.setProperty('--num-eff', chosen); return; }
    var rgb = rgbOf(chosen), r = rgb[0], g = rgb[1], b = rgb[2];
    var cL = (0.299 * r + 0.587 * g + 0.114 * b) / 255, t = 0;
    if (cL < 0.5) {                                     // dark colour: lift toward white on DARK scenes only
      var s = Math.min(1, Math.max(0, (0.46 - bgLuma) / 0.08));
      var targetL = cL + (0.9 - cL) * s;
      t = Math.min(1, ((targetL - cL) / (1 - cL)) * liftK);
    }
    r = r + (255 - r) * t; g = g + (255 - g) * t; b = b + (255 - b) * t;
    S.style.setProperty('--num-eff', 'rgb(' + Math.round(r) + ' ' + Math.round(g) + ' ' + Math.round(b) + ')');
  }
  function sampleBg() {                                 // OVERALL plate luminance (day vs night) — same for all modes
    var img = new Image();
    img.onload = function () {
      var W = 48, H = 27, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W, H);
      try {
        var d = g.getImageData(0, 0, W, H).data, sum = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
        bgLuma = n ? sum / n / 255 : 0.5;
      } catch (e) { bgLuma = 0.5; }
      setTone();
    };
    img.onerror = function () { setTone(); };
    img.src = withHG(phase);
  }

  // per-mode separator (lab applySepForMode, ~440-444, verbatim). The chip-list update is authoring UI that
  // doesn't exist yet (Task 7) — querySelectorAll returns an empty NodeList now, so forEach already no-ops.
  function applySepForMode(mode) {
    var noSep = (mode === 'middle' || mode === 'ledge');
    if (noSep) S.dataset.sep = 'none'; else if (S.dataset.sep === 'none') S.dataset.sep = 'colon';
    document.querySelectorAll('[data-k="sep"] .chip').forEach(function (c) {
      var isNone = c.dataset.v === 'none';
      c.disabled = noSep ? !isNone : isNone;
      c.classList.toggle('on', c.dataset.v === S.dataset.sep);
    });
  }

  // wiring (brief Steps 1-2): the locked look for cfg, then phase-driven plate + occluders
  function applyLook(cfg) {
    S.dataset.place = cfg.place;
    S.dataset.sep = cfg.sep;
    S.style.setProperty('--num-font', cfg.font);
    S.style.setProperty('--num-color', cfg.color);
    applyMode(cfg.place);
    S.dataset.vis = cfg.vis;
  }

  setPlate();
  applyLook(cfg);
  refreshFG();
  applySepForMode(cfg.place);
})();
</script>
