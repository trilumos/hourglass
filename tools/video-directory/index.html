<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sustain — This Month's Videos</title>
<style>
  /* One job: the 30 videos for THIS month, in shooting order, tickable. The 900M-combination explorer
     that used to live here answered a question nobody asks while recording. The reservoir is documented
     in the strategy; this page is the worklist. */
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#272e38; --ink:#e6edf3; --dim:#8b949e;
    --acc:#eaca78; --ok:#3fb950; --pad:clamp(12px,2vw,22px);
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#dde1e6; --ink:#1c2128; --dim:#61686f; --acc:#a1791b; }
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  header{ padding:var(--pad); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5 }
  h1{ margin:0 0 2px; font-size:clamp(17px,2.4vw,21px); font-weight:600; letter-spacing:-.01em }
  .sub{ color:var(--dim); font-size:13px }
  .bar{ display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap }
  .prog{ flex:1 1 220px; height:7px; background:var(--panel); border:1px solid var(--line);
         border-radius:99px; overflow:hidden; min-width:160px }
  .prog i{ display:block; height:100%; background:var(--ok); width:0; transition:width .3s }
  .count{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px }
  button{ padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
          color:var(--ink); font:inherit; font-size:13px; cursor:pointer }
  button:hover{ border-color:var(--acc) }
  main{ padding:var(--pad); max-width:1100px; margin:0 auto }
  .row{ border:1px solid var(--line); border-radius:11px; background:var(--panel); margin-bottom:9px;
        overflow:hidden }
  .row.done{ border-color:rgba(63,185,80,.45) }
  .row.next{ border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) }
  .head{ display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer }
  .head input{ width:18px; height:18px; accent-color:var(--ok); cursor:pointer; flex:0 0 auto }
  .day{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; width:44px; flex:0 0 auto }
  .kind{ font-size:15px; width:20px; flex:0 0 auto; text-align:center }
  .ttl{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px }
  .row.done .ttl{ color:var(--dim); text-decoration:line-through }
  .tag{ font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line);
        color:var(--dim); flex:0 0 auto }
  .tag.b{ color:var(--acc); border-color:var(--acc) }
  .body{ display:none; padding:0 14px 14px; border-top:1px solid var(--line) }
  .row.open .body{ display:block }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:12px 0 }
  .cell{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px }
  .cell b{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim);
           font-weight:500; margin-bottom:3px }
  .cell span{ font-size:13px }
  .cp{ position:relative; margin-top:10px }
  .cp b{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin-bottom:4px }
  .cp pre{ margin:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
           font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word }
  .cp button{ position:absolute; top:0; right:0; padding:3px 9px; font-size:11px }
  .note{ color:var(--dim); font-size:12px; margin-top:14px }
  .empty{ padding:40px; text-align:center; color:var(--dim) }
</style>
</head>
<body>
<header>
  <h1>Sustain — <span id="mLabel">this month</span></h1>
  <p class="sub">15 sessions across Pomodoro, Flow and Custom — each shot twice: once with ambience, once bell-only. Shoot top-down.</p>
  <div class="bar">
    <div class="prog"><i id="pFill"></i></div>
    <span class="count" id="pCount">0 / 0</span>
    <button id="jump">Jump to next</button>
    <button id="exp">Export ticks</button>
    <button id="imp">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>
<main id="list"><div class="empty">Loading month.json…</div></main>

<script>
(function(){
  'use strict';
  var KEY = 'sustain.month.done';
  var done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  var save = function(){ localStorage.setItem(KEY, JSON.stringify([].slice.call(done))); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); };

  fetch('./month.json').then(function(r){ return r.json(); }).then(render).catch(function(e){
    document.getElementById('list').innerHTML =
      '<div class="empty">Could not load <code>month.json</code>.<br>Run <code>node docs/youtube/gen-roadmap.cjs</code> and redeploy.</div>';
  });

  function render(plan){
    document.getElementById('mLabel').textContent = plan.label;
    var list = document.getElementById('list');
    list.innerHTML = plan.videos.map(function(v){
      var d = done.has(v.id);
      return '<div class="row' + (d ? ' done' : '') + '" data-id="' + v.id + '">'
        + '<div class="head">'
        +   '<input type="checkbox"' + (d ? ' checked' : '') + '>'
        +   '<span class="day">Day ' + v.day + '</span>'
        +   '<span class="kind">' + (v.silent ? '🔔' : '🌊') + '</span>'
        +   '<span class="ttl">' + esc(v.title) + '</span>'
        +   '<span class="tag' + (v.silent ? ' b' : '') + '">' + (v.silent ? 'silent' : 'ocean') + '</span>'
        +   '<span class="tag">' + esc(v.duration) + '</span>'
        + '</div>'
        + '<div class="body">'
        +   '<div class="grid">'
        +     cell('Mode', v.mode + ' ' + v.interval)
        +     cell('Blocks', v.blocks + ' → ' + v.duration)
        +     cell('Setup', v.setup)
        +     cell('Time of day', v.lightSetup)
        +     cell('Sound', v.sound)
        +     cell('Audio levels', v.audio)
        +     cell('Numerals', v.numerals)
        +   '</div>'
        +   copy('Title', v.title)
        +   copy('Tags — paste after the Upload-defaults tags', v.tags)
        +   copy('Description — paste ABOVE the Upload-defaults text', descOf(v))
        +   '<p class="note">ID <code>' + esc(v.id) + '</code>'
        +     (v.silent ? ' · silent twin of <code>' + esc(v.pairId) + '</code> — identical config, all sounds off' : '')
        +   '</p>'
        + '</div></div>';
    }).join('');

    list.addEventListener('click', function(e){
      var row = e.target.closest('.row'); if (!row) return;
      if (e.target.matches('input[type=checkbox]')){
        var id = row.dataset.id;
        e.target.checked ? done.add(id) : done.delete(id);
        row.classList.toggle('done', e.target.checked);
        save(); progress(plan);
        return;
      }
      if (e.target.closest('.cp button')) return;      // copy buttons must not collapse the row
      if (e.target.closest('.head')) row.classList.toggle('open');
    });
    list.addEventListener('click', function(e){
      var b = e.target.closest('.cp button'); if (!b) return;
      var txt = b.parentNode.querySelector('pre').textContent;
      navigator.clipboard.writeText(txt).then(function(){
        var old = b.textContent; b.textContent = 'copied'; setTimeout(function(){ b.textContent = old; }, 1200);
      });
    });
    progress(plan);
    document.getElementById('jump').addEventListener('click', function(){ jump(plan); });
    jump(plan);
  }

  function cell(k, v){ return '<div class="cell"><b>' + k + '</b><span>' + esc(v) + '</span></div>'; }
  function copy(k, v){
    return '<div class="cp"><b>' + esc(k) + '</b><button>copy</button><pre>' + esc(v) + '</pre></div>';
  }
  // The generator emits the finished head (v.desc) — this page must not re-word it. The old version
  // rebuilt the sentence here and hardcoded "pomodoro timer" and "ocean waves", which went wrong the
  // moment Flow and non-ocean sessions existed.
  function descOf(v){ return v.desc; }
  function progress(plan){
    var n = plan.videos.filter(function(v){ return done.has(v.id); }).length;
    document.getElementById('pCount').textContent = n + ' / ' + plan.videos.length;
    document.getElementById('pFill').style.width = (n / plan.videos.length * 100) + '%';
  }
  // Highlight and scroll to the first unticked row — the one to shoot today.
  function jump(plan){
    var next = plan.videos.filter(function(v){ return !done.has(v.id); })[0];
    [].forEach.call(document.querySelectorAll('.row.next'), function(r){ r.classList.remove('next'); });
    if (!next) return;
    var el = document.querySelector('.row[data-id="' + next.id + '"]');
    if (el){ el.classList.add('next', 'open'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
  }

  document.getElementById('exp').addEventListener('click', function(){
    var b = new Blob([JSON.stringify({ done:[].slice.call(done) }, null, 1)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'sustain-month-done.json'; a.click();
  });
  var file = document.getElementById('file');
  document.getElementById('imp').addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){
    var f = file.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try { (JSON.parse(rd.result).done || []).forEach(function(id){ done.add(id); }); save(); location.reload(); }
      catch (err){ alert('Not a valid export file.'); }
    };
    rd.readAsText(f);
  });
})();
</script>
</body>
</html>
