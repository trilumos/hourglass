<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustain — Session</title>
<style>
  /* Self-hosted, overlap-REMOVED static weights (fontTools removeOverlaps). This is why the outline
     (-webkit-text-stroke) traces ONLY the true glyph boundary — no variable-font internal seam lines. */
  @font-face{font-family:'Jost';font-weight:400;font-display:swap;src:url('assets/fonts/jost-400.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:500;font-display:swap;src:url('assets/fonts/jost-500.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:550;font-display:swap;src:url('assets/fonts/jost-550.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:600;font-display:swap;src:url('assets/fonts/jost-600.woff2') format('woff2')}
  @font-face{font-family:'Jost';font-weight:700;font-display:swap;src:url('assets/fonts/jost-700.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:400;font-display:swap;src:url('assets/fonts/newsreader-400.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:500;font-display:swap;src:url('assets/fonts/newsreader-500.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:550;font-display:swap;src:url('assets/fonts/newsreader-550.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:600;font-display:swap;src:url('assets/fonts/newsreader-600.woff2') format('woff2')}
  @font-face{font-family:'Newsreader';font-weight:700;font-display:swap;src:url('assets/fonts/newsreader-700.woff2') format('woff2')}
  :root{
    --plate: url("assets/plates/midday.jpg");
    --num-font: 'Newsreader', serif;
    --num-weight: 500;
    --num-color: #ffffff;
    --num-eff: #ffffff;   /* effective colour = --num-color lifted toward white on dark plates (setTone) */
    --num-size: 34;          /* in cqh, applied to the scene box */
    --num-scaleX: 1;
    --dx: 0px; --dy: 0px;    /* drag offset for the number block */
    --gap: 1.5cqw;           /* inline digit spacing (mm : ss) */
    --frost-bg:#35353566;    /* Setup's frost material — identical */
    --ink:#f2ecdd;           /* Setup's ink colour — used by the #gear icon + done-card text (Task 5) */
    /* ── Task 7: Setup's control-scale tokens, imported VERBATIM (setup.html :root, L16-52) so the
         ported settings sheet + chips + steppers + mixer match Setup pixel-for-pixel. Setup's type/
         spacing scale is panel-relative (--sq); brought in full because every type and control token
         derives from it. Page-layout tokens Setup uses only for its constellation are NOT brought. */
    --sq:      clamp(320px, 64vh, 640px);  /* vh, not container units: a :root custom property cannot resolve cqh
                                              (no container at :root), which collapsed every derived control/type
                                              token to invalid and zeroed control padding. #stage fills the viewport,
                                              so 64vh equals what 64cqh would have been. */
    --sp-in:   calc(var(--sq) * .018);
    --sp-grp:  calc(var(--sq) * .048);
    --t-xs:    calc(var(--sq) * .0205);
    --t-sm:    calc(var(--sq) * .0256);
    --t-md:    calc(var(--sq) * .032);
    --ctrl-y:  calc(var(--sq) * .023);
    --ctrl-x:  calc(var(--sq) * .046);
    --ink-dim: #cfc7b6;
    --gold:    #EACA78;
    --track:   rgba(255,255,255,.16);
    --e-std:   cubic-bezier(.4,0,.2,1);
  }
  /* Parallax removed per founder decision — bg/fg stay static; only the numbers (#nums) move,
     via drag (--dx/--dy). Occluders (.fg-glass/.fg-horizon/.fg-ledge) are static masked copies
     of the same plate, so they can never desync from the (also static) background. */
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ height:100%; background:#05080d; overflow:hidden;
    font-family:'Jost',system-ui,sans-serif; color:#e7ecf3 }

  /* ---- SITE-WIDE LOCKED PLATE RULE — identical to Home & Setup: the plate FILLS the viewport,
       background cover, position 50% 50% (= object-fit:cover; object-position:50% 50%). No letterbox,
       no transform, no zoom. The plate's fit/position/zoom must never deviate across the three pages. */
  #stage{ position:fixed; inset:0; container-type:size; overflow:hidden }
  #scene{ position:absolute; inset:0; container-type:size; overflow:hidden }
  .layer{ position:absolute; inset:0; width:100%; height:100%;
    background:var(--plate) center/cover no-repeat; pointer-events:none }
  .bg{ z-index:0 }

  /* ---- numbers live BETWEEN bg and the foreground occluders ---- */
  #nums{ position:absolute; inset:0; z-index:1; touch-action:none; will-change:transform;
    transform:translate3d(var(--dx,0px),var(--dy,0px),0);
    transition:opacity .5s ease }
  .num{ position:absolute; left:50%; top:50%; line-height:1; white-space:nowrap;
    text-box:trim-both cap alphabetic;   /* centre by cap-height/baseline → font-metric-independent */
    font-family:var(--num-font); font-weight:var(--num-weight);
    font-size:calc(var(--num-size)*1cqh); color:var(--num-eff,var(--num-color));
    -webkit-text-fill-color:var(--num-eff,var(--num-color));
    transform:translate(-50%,-50%) scaleX(var(--num-scaleX));
    font-variant-numeric:tabular-nums; letter-spacing:-.01em }

  /* ---- foreground occluders: plate-copies masked to the occluding shape ---- */
  .fg{ z-index:2; opacity:0; transition:opacity .25s ease }
  .fg.active{ opacity:1 }
  /* ledge = bottom ~11.3% of the plate, a straight cut */
  .fg-ledge{ -webkit-mask-image:linear-gradient(to top,#000 0 11.3%,transparent 11.3%);
             mask-image:linear-gradient(to top,#000 0 11.3%,transparent 11.3%) }
  /* hourglass = real silhouette matte (segmentation-extracted from the plate) */
  .fg-glass{ -webkit-mask-image:url(assets/hourglass-matte.png); mask-image:url(assets/hourglass-matte.png);
             -webkit-mask-size:cover; mask-size:cover;
             -webkit-mask-position:center; mask-position:center;
             -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  /* horizon = founder's flat sea-horizon matte, opaque below ~55% */
  .fg-horizon{ -webkit-mask-image:url(assets/skyline-matte.png); mask-image:url(assets/skyline-matte.png);
             -webkit-mask-size:cover; mask-size:cover;
             -webkit-mask-position:center; mask-position:center;
             -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }

  /* ================= FILLS ================= */
  #scene[data-fill="solid"] .num{     /* colour lifts toward white on dark plates (setTone); a subtle
       dark drop grounds it on bright plates */
    text-shadow:0 1px 2px rgb(0 0 0 / 32%), 0 2px 22px rgb(0 0 0 / 20%) }
  #scene[data-fill="glass"] .num{      /* translucent liquid-glass */
    color:rgba(255,255,255,.26); -webkit-text-fill-color:rgba(255,255,255,.26);
    -webkit-text-stroke:1px rgba(255,255,255,.5);
    text-shadow:0 1px 1px rgba(255,255,255,.35), 0 6px 34px rgba(0,0,0,.28) }
  #scene[data-fill="outline"] .num{      /* hollow border (overlap-removed static fonts); stroke lifts at night */
    color:transparent; -webkit-text-fill-color:transparent;
    -webkit-text-stroke:1.5px var(--num-eff,var(--num-color)); text-shadow:none; paint-order:stroke }

  /* ================= SEPARATOR (sectioning between mm and ss) ================= */
  #sep::before{ content:":" }                                      /* colon (default) */
  #scene[data-sep="dot"]  #sep::before{ content:"·" }              /* middle dot */
  #scene[data-sep="none"] #sep{ display:none }                     /* gap only */
  #scene[data-sep="line"] #sep::before{ content:""; display:inline-block; align-self:center;
    width:.08em; height:.58em; border-radius:99px; background:var(--num-color) }   /* hairline rule */

  /* ================= PLACEMENTS — 4 modes; only vertical position (--tb-top) differs =================
     mm anchored right-of-centre, ss anchored left-of-centre, sep floated dead-centre. So the position
     is INDEPENDENT of font width AND separator choice — a wider font just extends outward, and the
     inner edges stay put. --gap = half-gap (distance from centre to each inner edge). */
  .tb{ position:absolute; inset:0 }
  /* centre axis = --hg-cx: the HOURGLASS axis (49% = its posts' midpoint) for Top/Middle/Ledge so the
     flanking numbers are symmetric to the GLASS, not the plate. Horizon keeps 50% (it's free-dragged). */
  #mm{ right:calc((100% - var(--hg-cx,50%)) + var(--gap)); left:auto; top:var(--tb-top,50%);
       transform:translateY(-50%) scaleX(var(--num-scaleX)) }
  #ss{ left:calc(var(--hg-cx,50%) + var(--gap));  right:auto; top:var(--tb-top,50%);
       transform:translateY(-50%) scaleX(var(--num-scaleX)) }
  #sep{ left:var(--hg-cx,50%); right:auto; top:var(--tb-top,50%);
        transform:translate(-50%,-50%) scaleX(var(--num-scaleX)) }
  #scene[data-place="top"]     { --tb-top:15%; --hg-cx:49.79% }   /* X locked to the hourglass axis */
  #scene[data-place="middle"]  { --tb-top:48%; --hg-cx:49.79% }
  #scene[data-place="horizon"] { --tb-top:55% }
  #scene[data-place="ledge"]   { --tb-top:78%; --hg-cx:49.79% }

  /* ================= VISIBILITY ================= */
  #scene[data-vis="hover"] #nums{ opacity:0 }
  #scene[data-vis="hover"]:hover #nums{ opacity:1 }
  #scene[data-vis="hidden"] #nums{ opacity:0 }     /* Task 7: settings "Hidden" — numbers off, scene only */
  #scene[data-vis="flash"] #nums{ animation:flash 12s ease-in-out infinite }
  @keyframes flash{ 0%,78%,100%{opacity:0} 84%,94%{opacity:1} }
  @media (prefers-reduced-motion:reduce){
    .bg,#nums,.fg{ transform:none !important }
    #scene[data-vis="flash"] #nums{ animation:none; opacity:1 } }

  /* ================= CONTROLS (Task 5) — Setup's frost material, reused verbatim ================= */
  /* .frost copied byte-for-byte from setup.html (~L89) — the one shared frost material. */
  .frost{
    background:var(--frost-bg);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow: inset 0 0 4px -2px #ffffff55, 0 0 4px -2px #ffffff55,
                0 22px 55px rgba(0,0,0,.34);
    border:1px solid rgba(255,255,255,.06);
  }
  @media (prefers-reduced-transparency: reduce){
    .frost{ background:#1a1d26f2; -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  /* ---- session chrome redesign (Direction B): settings/give-up are quiet corner controls,
       Pause is the one primary action — a standalone circle so it clears the hourglass sand
       (vs. the old wide bottom pill). ---- */

  /* top-left — settings. Small frost circle, inline-SVG sliders glyph (no emoji). */
  #gear{
    position:absolute; left:clamp(12px,2cqi,20px); top:clamp(12px,2cqi,20px); z-index:5;
    width:clamp(34px,3.4cqi,44px); aspect-ratio:1; border-radius:50%;
    border:none; padding:0; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #gear svg{ width:52%; height:52%; }

  /* top-right — the rare/destructive exit. Deliberately quiet text, never a peer of Pause. */
  #giveup{
    position:absolute; right:clamp(14px,2.2cqi,22px); top:clamp(14px,2.2cqi,22px); z-index:5;
    min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;
    font-family:inherit; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
    font-size:clamp(11px,1.15cqi,13px); color:var(--ink-dim); cursor:pointer;
    padding:.5em .7em; border-radius:100px; border:none; background:none;
    transition:color .2s,background .2s;
  }
  #giveup:hover, #giveup:focus-visible{ color:var(--ink); background:rgba(255,255,255,.08); }

  /* bottom-centre — Pause/Resume, the one main control. A frost circle (not a pill) so it clears
     the hourglass sand; the media glyph swaps in JS, the gold ring is the paused state. */
  #pause{
    position:absolute; left:50%; bottom:clamp(20px,4.5cqh,52px); transform:translateX(-50%); z-index:5;
    width:clamp(48px,6cqh,60px); aspect-ratio:1; border-radius:50%;
    border:none; padding:0; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition:filter .2s, transform .1s;
  }
  #pause svg{ width:42%; height:42%; }
  #pause:hover{ filter:brightness(1.2); }
  #pause:active{ transform:translateX(-50%) scale(.96); }
  /* paused state — the one rare, stateful use of the gold accent. box-shadow isn't additive
     across rules, so .frost's own shadows are repeated here alongside the ring; neither is lost. */
  #pause.paused{
    box-shadow: inset 0 0 4px -2px #ffffff55, 0 0 4px -2px #ffffff55,
                0 22px 55px rgba(0,0,0,.34), 0 0 0 1.5px var(--gold);
  }

  /* paused overlay — glass scrim above the scene+numbers (z0-2), below chrome (z5), so the blur
     sits UNDER Settings/Give-up/the Resume circle but ABOVE the plate + timer. Tapping it resumes. */
  #paused{
    position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.6em; opacity:0; pointer-events:none;
    transition:opacity .45s var(--e-std);
    -webkit-backdrop-filter:blur(16px) saturate(.9); backdrop-filter:blur(16px) saturate(.9);
    background:rgba(8,12,20,.18);
  }
  #paused.show{ opacity:1; pointer-events:auto; }
  @media (prefers-reduced-transparency: reduce){
    #paused{ background:rgba(20,24,32,.86); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  .paused-word{
    font-family:'Jost',sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.28em;
    font-size:clamp(34px,9cqh,104px); color:#fff; line-height:1;
  }
  .paused-grace{
    font-family:'Jost',sans-serif; font-weight:500; font-size:clamp(12px,1.5cqi,16px);
    letter-spacing:.06em; color:var(--gold); opacity:0; transition:opacity .3s var(--e-std);
  }
  .paused-grace.show{ opacity:1; }

  /* Endless "Flip" — quiet secondary like Give-up, centred just above the pause circle. */
  #flipBtn{
    position:absolute; left:50%; transform:translateX(-50%); z-index:5;
    bottom:calc(clamp(20px,4.5cqh,52px) + clamp(48px,6cqh,60px) + .8em);
    font-family:inherit; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
    font-size:clamp(11px,1.15cqi,13px); color:var(--ink-dim); cursor:pointer;
    padding:.5em .9em; border-radius:100px; border:none; background:none;
    transition:color .2s,background .2s;
  }
  #flipBtn[hidden]{ display:none; }
  #flipBtn:hover, #flipBtn:focus-visible{ color:var(--ink); background:rgba(255,255,255,.08); }

  /* chrome fade-when-idle — ALL chrome controls. Kept fully separate from S.dataset.vis
     (Task 4's number-visibility) and from #done (a modal — exempt, never opacity-governed here). */
  #gear, #giveup, #pause, #flipBtn, #intentTop{ opacity:0; transition:opacity .4s var(--e-std); }
  body.active #gear, body.active #giveup, body.active #pause, body.active #flipBtn, body.active #intentTop{ opacity:1; }
  /* the user's Intention, quiet at top-centre — reveals/fades with the chrome. */
  #intentTop{ position:absolute; top:clamp(16px,2.6cqi,30px); left:50%; transform:translateX(-50%); z-index:5;
    max-width:56cqi; text-align:center; font-family:'Jost',sans-serif; font-weight:400; font-size:clamp(12px,1.5cqi,17px);
    letter-spacing:.03em; color:var(--ink); text-shadow:0 1px 10px rgba(0,0,0,.4); pointer-events:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #intentTop[hidden]{ display:none; }

  /* the only gold focus ring in the app — reserved for these controls */
  #gear:focus-visible, #giveup:focus-visible, #pause:focus-visible, #flipBtn:focus-visible{
    outline:2px solid var(--gold); outline-offset:3px;
  }

  /* done-state overlay — dim scrim + a centred .frost card (Setup's material, not a new one).
     Fully visible whenever shown; the idle-fade rule above never touches it. */
  #done, #giveupConfirm, #sessionOver{ position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center;
    background:rgba(6,9,15,.42); -webkit-backdrop-filter:blur(18px) saturate(.92); backdrop-filter:blur(18px) saturate(.92); }
  #done[hidden], #giveupConfirm[hidden], #sessionOver[hidden]{ display:none }
  /* popup card — deep glass frost (stronger than .frost), serif heading, primary/ghost buttons. */
  .popcard{ padding:clamp(34px,5cqi,58px) clamp(38px,7cqi,74px); border-radius:clamp(24px,2.8cqi,36px);
    text-align:center; max-width:min(460px,88cqi);
    background:rgba(255,255,255,.09); -webkit-backdrop-filter:blur(46px) saturate(1.25); backdrop-filter:blur(46px) saturate(1.25);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 34px 90px -30px rgba(0,0,0,.62); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .popcard{ background:#1a1d26f5; } }
  .popcard-title{ font-family:'Newsreader',serif; font-weight:400; font-size:clamp(24px,3.2cqi,38px);
    color:var(--ink-hi,#fdf6e6); letter-spacing:.01em; line-height:1.12; }
  .popcard-sub{ font-size:clamp(13px,1.5cqi,16px); color:var(--ink-dim); margin-top:.55em; line-height:1.5; }
  .popcard-sub b{ color:var(--ink); font-weight:500; }
  .popcard-btns{ display:flex; gap:.7em; justify-content:center; margin-top:1.9em; }
  .popcard-btns button{ font-family:inherit; font-weight:500; letter-spacing:.05em; font-size:clamp(12px,1.35cqi,15px);
    cursor:pointer; padding:.85em 1.9em; border-radius:100px; border:none; transition:background .18s,transform .1s; }
  .popcard-btns button:active{ transform:scale(.97); }
  .pop-primary{ background:#fff; color:#181a20; }
  .pop-primary:hover{ background:#f1ede3; }
  .pop-ghost{ background:rgba(255,255,255,.07); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .pop-ghost:hover{ background:rgba(255,255,255,.13); }
  .pop-danger{ color:#f0a98c; }

  /* ================= SEGMENT LABEL + ENDLESS FLIP (Task 6) ================= */
  /* transition toast — Setup's frost material, reused; fades in on a segment change, auto-fades ~2s later */
  #seglabel{
    position:absolute; left:50%; top:clamp(20px,6cqh,56px); transform:translateX(-50%); z-index:4;
    padding:.7em 1.6em; border-radius:100px; pointer-events:none;
    font-family:inherit; font-weight:500; letter-spacing:.15em; text-transform:uppercase;
    font-size:clamp(10px,1.05cqi,14px); color:var(--ink);
    opacity:0; transition:opacity .4s;
  }
  #seglabel.show{ opacity:1 }
  /* full-screen fade-through-black for Endless's user-triggered "flip" (reset the count, no sand anim in v1) */
  #flip{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .5s; z-index:7 }

  /* ================= ⚙ SETTINGS SHEET (Task 7) — Setup's frost sheet + controls, ported VERBATIM ================= */
  /* Sheet shell — copied byte-for-byte from setup.html (~L393-409). */
  .sheet-scrim{ position:absolute; inset:0; z-index:8; background:rgba(4,6,12,.5);
     -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); opacity:0; pointer-events:none;
     transition:opacity .3s var(--e-std); }
  .sheet-scrim.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; z-index:9; left:50%; top:50%; transform:translate(-50%,-46%) scale(.98);
    width:min(560px,86cqi); max-height:84cqh; overflow:hidden; display:flex; flex-direction:column; border-radius:clamp(20px,2.4cqi,32px);
    padding:clamp(20px,2.6cqi,36px); opacity:0; pointer-events:none;
    transition:opacity .3s var(--e-std), transform .3s var(--e-std);
  }
  .sheet.open{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  /* thin scrollbar — identical to Setup's .themes-scroll (setup.html ~L144-149) */
  .sheet-head{ flex:none; }
  /* Scroll on a RECTANGULAR inner wrapper so the bar (and any native arrows) stay INSIDE the panel,
     off the rounded corners. margin/padding-right gives a small inset — bar hugs near the edge, no wide gutter. */
  .sheet-scroll{ overflow-y:auto; min-height:0; flex:1 1 auto; margin-right:-6px; padding-right:6px;
     scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.32) transparent; }
  .sheet-scroll::-webkit-scrollbar{ width:8px; }
  .sheet-scroll::-webkit-scrollbar-button{ display:none; height:0; width:0; }
  .sheet-scroll::-webkit-scrollbar-track,.sheet-scroll::-webkit-scrollbar-corner{ background:transparent; }
  .sheet-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.24); border-radius:99px;
     border:2px solid transparent; background-clip:padding-box; }
  .sheet-scroll:hover::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.42); background-clip:padding-box; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-grp); }
  .sheet-head h3{ font-weight:400; font-size:clamp(13px,1.5cqi,20px); letter-spacing:.02em; }
  .sheet-close{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.08); border:none;
                color:var(--ink); font-size:18px; cursor:pointer; }
  .sec{ margin-bottom:var(--sp-grp); }
  .sec>.mini-lbl{ display:block; margin-bottom:.7em; }

  /* mini-lbl (setup.html ~L179) */
  .mini-lbl{ font-weight:500; letter-spacing:.2em; text-transform:uppercase; font-size:var(--t-sm); opacity:.8; }

  /* chips + chip rows (setup.html ~L225, L261-268) — Sound multi-select tokens + Scene manual-phase row
     (the two places chips are still correct: multi-select, and 6 uneven-length peers — see research doc). */
  .chips{ display:flex; flex-wrap:wrap; gap:var(--sp-in); justify-content:center; }
  .chip{
    font-family:inherit; font-weight:400; font-size:var(--t-md); color:var(--ink);
    cursor:pointer; padding:var(--ctrl-y) var(--ctrl-x); border-radius:100px; background:var(--frost-bg);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); border:none;
    transition:background .18s,color .18s; white-space:nowrap;
  }
  .chip:hover{ background:rgba(255,255,255,.16); }
  .chip.on{ background:#fff; color:#181a20; font-weight:500; box-shadow:0 1px 6px rgba(0,0,0,.18); }
  .chip:disabled{ opacity:.32; cursor:not-allowed; }
  /* Sound: same chip look, laid out as Setup's even 2-col token grid instead of a wrapping row —
     fixes the old sheet's wrap/overlap. Still multi-select (research doc: chips are correct here). */
  .tokens{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-in); }
  .tokens .chip{ width:100%; text-align:center; }

  /* mini segmented control (setup.html ~L361-366) — the ONE compact-control language: every ≤4-option/
     on-off/picker row (Timer, Placement, Fill, Font, Separator, Follow my day, Auto-contrast). */
  .mini-seg{ display:flex; background:rgba(255,255,255,.06); border-radius:100px;
             padding:calc(var(--sq)*.005); flex:none; }
  .mini-seg button{ font-family:inherit; font-size:var(--t-sm); color:var(--ink-dim);
                    cursor:pointer; padding:calc(var(--ctrl-y)*.75) .85em; border-radius:100px;
                    background:none; border:none; white-space:nowrap; }
  .mini-seg button.on{ color:#181a20; background:#fff; font-weight:500; }
  .mini-seg button:disabled{ opacity:.32; cursor:not-allowed; }

  /* range slider (setup.html ~L297-305) — master volume + per-sound mixer */
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:calc(var(--sq)*.009);
     border-radius:99px;
     background:linear-gradient(to right,var(--gold) var(--fill,100%),var(--track) var(--fill,100%)); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:calc(var(--sq)*.032);
     height:calc(var(--sq)*.032); border-radius:50%;
     background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:calc(var(--sq)*.032); height:calc(var(--sq)*.032);
     border:none; border-radius:50%;
     background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); cursor:pointer; }

  /* volume head + per-sound mixer (setup.html ~L293-296, L317-322) */
  .sound-vol{ margin-top:var(--sp-grp); }
  .vol-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.6em; }
  .vol-head .mini-lbl{ opacity:.6; }
  .vol-head .pct{ font-variant-numeric:tabular-nums; font-size:var(--t-md); opacity:.9; }
  .mix-row{ display:flex; align-items:center; gap:.7em; margin-top:.6em; }
  .mix-row .mr-k{ width:6.2em; flex:none; font-size:var(--t-sm); color:#fff; }
  .mix-row input[type=range]{ flex:1; }
  .mix-row .mr-v{ width:2.8em; flex:none; text-align:right; font-variant-numeric:tabular-nums;
                  font-size:var(--t-xs); opacity:.7; }
  .mix-empty{ font-size:var(--t-sm); opacity:.6; margin-top:.6em; }
  #mixRows{ margin-top:var(--sp-in); }

  /* number-look Colour swatch — native picker (brief C.3) */
  .color-pick{ width:calc(var(--sq)*.09); height:calc(var(--sq)*.06); padding:0; cursor:pointer;
               border:1px solid rgba(255,255,255,.2); border-radius:10px; background:none; }
  .set-lbl{ font-size:var(--t-sm); color:var(--ink-dim); }
  .sec-row2{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-in); margin-top:var(--sp-in); }
  /* Colour: round preset swatches + a rainbow "custom" swatch (hidden native picker overlaid). */
  .swatches{ display:flex; align-items:center; gap:.5em; }
  .sw-c{ width:1.5em; height:1.5em; border-radius:50%; border:none; cursor:pointer; padding:0; flex:none;
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); position:relative; }
  .sw-c.on{ box-shadow:0 0 0 2px var(--gold); }
  .sw-custom{ overflow:hidden; display:inline-flex;
     background:conic-gradient(from 90deg,#e6a6b0,#eaca78,#a7d18f,#8fb7e0,#b99ce6,#e6a6b0); }
  .sw-custom input[type=color]{ position:absolute; inset:-30%; width:160%; height:160%;
     border:none; padding:0; background:none; cursor:pointer; opacity:0; }
  /* Scene: Setup-style Time-of-day image grid (setup.html .tod-opts/.todo/.dot/.cap, verbatim). */
  .tod-opts{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-in); margin-top:.6em; }
  .todo{ background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
     align-items:center; gap:.4em; padding:0; color:var(--ink); }
  .todo .dot{ width:calc(var(--sq)*.088); aspect-ratio:1; border-radius:50%; background-size:200%;
     box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); transition:box-shadow .2s,transform .15s; }
  .todo.on .dot{ box-shadow:0 0 0 2px var(--gold); transform:scale(1.04); }
  .todo .cap{ font-weight:400; font-size:var(--t-xs); opacity:.9; white-space:nowrap; }
  .todo.on .cap{ opacity:1; }
  .dot.follow{ background:conic-gradient(from 210deg,#1a2440,#3a4d78 25%,#e6a86b 50%,#7db4e6 62%,#2a3350 88%,#1a2440); }

  /* hidden-timer readout — only shown when the on-scene numbers are set to Hidden (cfg.vis), so opening
     Settings never leaves you with zero read on the session clock. */
  .hidden-time{ text-align:center; font-weight:500; font-variant-numeric:tabular-nums;
                font-size:clamp(28px,4cqi,44px); color:var(--ink); margin-bottom:var(--sp-grp); }
  .hidden-time[hidden]{ display:none; }
</style>
</head>

<script src="js/plan.js?v=5"></script>
<script src="js/session-timer.js?v=1"></script>
<script>
(function () {
  // Hard-reload / direct-open guard: Setup arms a one-shot flag on Begin; the session consumes it on first
  // load, so a reload (or opening session.html directly) finds it gone -> the session is over. Show the end
  // screen instead of a broken resume. No nav-guard is installed in this branch, so the user can leave freely.
  if (sessionStorage.getItem('sustain.armed') !== '1') {
    document.getElementById('sessionOver').hidden = false;
    document.getElementById('soSetup').addEventListener('click', function () { location.href = 'setup.html'; });
    return;
  }
  sessionStorage.removeItem('sustain.armed');
  var S = document.getElementById('scene'), mm = document.getElementById('mm'), ss = document.getElementById('ss');
  var cfg = JSON.parse(localStorage.getItem('sustain.session') || 'null')
         || { mode:'flow', flowMin:25, place:'middle', fill:'solid', phase:2, sounds:[], vol:100, soundVol:{sand:100,ocean:100,breeze:100,birds:100}, sep:'none', font:"'Newsreader',serif", color:'#ffffff', vis:'always', followDay:true, autoContrast:true };
  var plan = Plan.buildPlan(cfg);
  var timer = SessionTimer.create(plan, { endless: cfg.mode === 'endless' });
  timer.start();
  softCue();   // session-start bell (best-effort — silent until the first tap unlocks audio; see note in softCue)
  var fmt2 = function (n) { return String(n).padStart(2,'0'); };

  // Task 7 contract: the ported audio engine assigns its live AudioContext here
  // (sharedCtx = <engine ctx>) so softCue() below becomes audible. Until then it stays
  // null and softCue no-ops silently (no throw) — expected pre-Task-7 behaviour.
  var sharedCtx = null;
  var cueBuffer = null;   // decoded cue_bell.mp3 — loaded once the AudioContext inits (see ensureAudio)

  // ================= controls (Task 5) — pause/resume, end, done-state, focusedToday =================
  var focusMin = Plan.totalFocusOf(plan), shownDone = false, lastSegIndex = 0;
  var doneEl = document.getElementById('done'), doneMinEl = document.getElementById('doneMin');
  function bumpFocusedToday(min) {
    var k = 'sustain.focusedToday', today = new Date().toISOString().slice(0,10);
    var o = JSON.parse(localStorage.getItem(k) || 'null');
    if (!o || o.date !== today) o = { date: today, min: 0 };
    o.min += min;
    localStorage.setItem(k, JSON.stringify(o));
  }
  var counted = false;
  function commitFocus(min){ if(counted) return; counted = true; if(min >= 2) bumpFocusedToday(min); }   // credit actual focus, ≥2 min only (app parity)
  function focusedSoFarMin(){                                    // actual focus minutes elapsed so far (excludes rests)
    var p = timer.progress();
    if(cfg.mode === 'endless') return Math.floor(p.elapsedMs/60000);
    var elapsed = p.elapsedMs, acc = 0, focusMs = 0;
    for(var i=0;i<plan.length;i++){ var segMs = plan[i].min*60000;
      focusMs += (plan[i].kind === 'focus') ? Math.max(0, Math.min(elapsed, acc+segMs) - acc) : 0;
      acc += segMs; if(elapsed < acc) break; }
    return Math.floor(focusMs/60000);
  }
  // Screen Wake Lock — keep the display awake through a focus session; re-acquire when the tab refocuses.
  var wakeLockObj = null;
  function requestWakeLock(){ if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(w){ wakeLockObj = w; }).catch(function(){}); }
  requestWakeLock();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') requestWakeLock(); });
  function endSession() {
    commitFocus(focusedSoFarMin());                             // credit actual focus (≥2m) on any intentional exit, incl. give-up
    if(wakeLockObj){ wakeLockObj.release().catch(function(){}); wakeLockObj = null; }
    guardActive = false; location.href = 'setup.html';
  }

  // ================= navigation guard — a running session must NEVER be abandoned by accident =================
  // Trap Back/back-swipe in a pushState loop + warn on reload/close. Cleared only by an intentional
  // exit (endSession, above) — "Again" and normal completion never navigate, so they're unaffected.
  var guardActive = true;
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function () {
    if (!guardActive) return;
    history.pushState(null, '', location.href);
    showSegLabel('Use "Give up" to end your session');
  });
  window.addEventListener('beforeunload', function (e) {
    if (guardActive) { e.preventDefault(); e.returnValue = ''; }
  });

  // Ritual cue — the same soft bell the app rings at session start/end and each break boundary.
  // Needs an unlocked AudioContext (sharedCtx) + the loaded buffer; otherwise no-ops silently
  // (web autoplay: audio can't sound before the user's first gesture on the page).
  function softCue() {
    if (sharedCtx == null || cueBuffer == null) return;
    sharedCtx.resume();
    var t = sharedCtx.currentTime;
    var src = sharedCtx.createBufferSource(); src.buffer = cueBuffer;
    var g = sharedCtx.createGain(); g.gain.value = 0.55;      // app's cue volume
    g.gain.setValueAtTime(0.55, t + 4.2);                     // ~4.5s cue, then a short tail fade so the long
    g.gain.linearRampToValueAtTime(0, t + 4.9);               // bell doesn't ring on forever (app clips to 5s)
    src.connect(g).connect(sharedCtx.destination);
    src.start(t); src.stop(t + 5.0);
  }

  var seglabelEl = document.getElementById('seglabel'), seglabelT = null;
  function showSegLabel(text) {
    seglabelEl.textContent = text;
    seglabelEl.classList.add('show');
    clearTimeout(seglabelT);
    seglabelT = setTimeout(function () { seglabelEl.classList.remove('show'); }, 2000);
  }

  var hiddenTimeEl = document.getElementById('hiddenTime');
  function tick() {
    var p = timer.progress();
    var totalSec = cfg.mode === 'endless' ? Math.floor(p.elapsedMs/1000) : Math.ceil(p.remainingMs/1000);
    var mmText = fmt2(Math.floor(totalSec/60) % 100), ssText = fmt2(totalSec % 60);
    mm.textContent = mmText;
    ss.textContent = ssText;
    hiddenTimeEl.hidden = cfg.vis !== 'hidden';   // settings-sheet readout when the on-scene numbers are off
    if (cfg.vis === 'hidden') hiddenTimeEl.textContent = mmText + ':' + ssText;
    if (!p.done && p.segIndex !== lastSegIndex) {   // segment auto-advance — guarded so it never fires at t=0 or on done
      // note: a multi-segment jump after tab-backgrounding intentionally lands on the current
      // segment with a single cue here (no burst of stacked cues for skipped segments)
      softCue(p.kind);
      showSegLabel(p.kind === 'rest' ? 'Break · ' + Plan.fmt(plan[p.segIndex].min) : 'Focus');
      lastSegIndex = p.segIndex;
      breakDuck = (p.kind === 'rest') ? BREAK_DUCK : 1;            // hush the ambient on a break, restore on focus
      if (master && !timer.isPaused()) master.gain.setTargetAtTime(gainFor()*breakDuck, AC.currentTime, 0.6);
    }
    if (p.done && !shownDone) {          // endless mode never reaches here — progress().done stays false forever
      shownDone = true;
      softCue();                         // session-end bell
      commitFocus(focusMin);             // credit focus once, ≥2 min
      doneMinEl.textContent = Plan.fmt(focusMin);
      doneEl.hidden = false;
    }
  }
  tick(); setInterval(tick, 250);   // 250ms so the seconds flip crisply; engine is wall-clock, not tick-accumulated

  var pauseBtn = document.getElementById('pause');
  var pausedEl = document.getElementById('paused'), pauseGrace = document.getElementById('pauseGrace');
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>';
  var PLAY_SVG  = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';

  // ---- pause cap — app parity: 3min + 15s grace, then auto-abandon. Wall-clock (Date.now()), not
  // tick-accumulated, so it survives tab-backgrounding (checkPauseCap re-derives elapsed each tick).
  var PAUSE_CAP = 180000, PAUSE_GRACE = 15000;
  var pausedAt = null, pauseWatch = null;
  function checkPauseCap() {
    var el = Date.now() - pausedAt;
    if (el >= PAUSE_CAP + PAUSE_GRACE) { clearInterval(pauseWatch); pauseWatch = null; endSession(); return; }
    if (el >= PAUSE_CAP) {
      var left = Math.ceil((PAUSE_CAP + PAUSE_GRACE - el) / 1000);
      pauseGrace.textContent = 'Resume now · ' + left + 's to keep your session';
      pauseGrace.classList.add('show');
    } else {
      pauseGrace.classList.remove('show');
    }
  }
  function pauseSession() {
    timer.pause();
    pauseBtn.innerHTML = PLAY_SVG; pauseBtn.classList.add('paused');
    pauseBtn.setAttribute('aria-pressed', 'true'); pauseBtn.setAttribute('aria-label', 'Resume session');
    pausedEl.classList.add('show');
    wake();                            // keep the chrome (Resume/Settings/Give up) visible while paused
    if (master) {                      // fade theme sounds to silence — master only; sources keep running
      var t = AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(0, t, 0.15);
    }
    pausedAt = Date.now();
    pauseWatch = setInterval(checkPauseCap, 500);
  }
  function resumeSession() {
    timer.resume();
    pauseBtn.innerHTML = PAUSE_SVG; pauseBtn.classList.remove('paused');
    pauseBtn.setAttribute('aria-pressed', 'false'); pauseBtn.setAttribute('aria-label', 'Pause session');
    pausedEl.classList.remove('show');
    wake();                            // reveal chrome, then it fades again on its own since the session is running
    syncAudio();                       // re-ramps master back to gainFor() — gapless, sources never stopped
    clearInterval(pauseWatch); pauseWatch = null; pausedAt = null;
    pauseGrace.classList.remove('show');
  }
  pauseBtn.addEventListener('click', function () {
    if (timer.isPaused()) resumeSession(); else pauseSession();
  });
  pausedEl.addEventListener('click', resumeSession);   // tap the blurred scene to resume
  var giveupConfirmEl = document.getElementById('giveupConfirm');
  document.getElementById('giveup').addEventListener('click', function () { giveupConfirmEl.hidden = false; });
  document.getElementById('gcKeep').addEventListener('click', function () { giveupConfirmEl.hidden = true; });
  document.getElementById('gcGive').addEventListener('click', endSession);
  // the user's Intention from Setup, shown quietly at top-centre (fades with the chrome).
  var intentTopEl = document.getElementById('intentTop');
  if (cfg.intention) { intentTopEl.textContent = cfg.intention; intentTopEl.hidden = false; }
  document.getElementById('doneEnd').addEventListener('click', endSession);
  document.getElementById('again').addEventListener('click', function () {
    timer = SessionTimer.create(plan, { endless: cfg.mode === 'endless' });
    timer.start();
    shownDone = false;
    lastSegIndex = 0;
    counted = false;                    // a fresh run credits its own focus
    breakDuck = 1; if (master) syncAudio();   // clear any leftover break-hush
    doneEl.hidden = true;
  });
  // #gear → opens the settings sheet (wired in the Task 7 block below).

  // ================= Endless fade-flip (Task 6) — user-triggered reset, fade through black =================
  function fadeFlip(reset) {
    var f = document.getElementById('flip');
    f.style.opacity = '1';
    setTimeout(function () { reset(); f.style.opacity = '0'; }, 500);
  }
  if (cfg.mode === 'endless') {
    var flipBtn = document.getElementById('flipBtn');
    flipBtn.hidden = false;
    flipBtn.addEventListener('click', function () {
      fadeFlip(function () {
        timer = SessionTimer.create(plan, { endless: true });
        timer.start();
        lastSegIndex = 0;
      });
    });
  }

  // chrome fade-when-idle — all chrome controls (#gear/#giveup/#pause/#flipBtn). Kept separate
  // from S.dataset.vis (Task 4's number-visibility) and from #done (a modal — never governed by this).
  var idleT = null;
  function wake() {
    document.body.classList.add('active');
    clearTimeout(idleT);
    idleT = setTimeout(function () { if (!timer.isPaused()) document.body.classList.remove('active'); }, 3000);  // chrome stays put while paused
  }
  window.addEventListener('pointermove', wake);
  window.addEventListener('touchstart', wake, { passive: true });
  wake();

  // ================= number treatment — ported VERBATIM from web-prototype/number-lab.html =================
  // (founder-LOCKED design; logic not re-derived, only paths/vars adapted for site/ + cfg-driven wiring)

  // PHASES/withHG plate helper (lab ~281-287). Only with-hourglass plates exist under site/assets/plates/,
  // and v1 has no hourglass on/off toggle — the wooden hourglass is the scene hero, always shown.
  var PHASES = ['pre-dawn', 'sunrise', 'midday', 'sunset', 'twilight', 'midnight'];
  function withHG(i) { return 'assets/plates/' + PHASES[i] + '.jpg'; }
  function setPlate() {
    document.documentElement.style.setProperty('--plate', 'url("' + withHG(phase) + '")');
    sampleBg();   // re-sample bg luminance for auto-contrast
  }

  // phase resolver (brief Step 2, verbatim): local clock hour -> phase index when cfg.followDay
  function phaseFromClock() {
    var h = new Date().getHours();
    if (h >= 4 && h < 6)  return 0;   // pre-dawn
    if (h >= 6 && h < 9)  return 1;   // sunrise
    if (h >= 9 && h < 16) return 2;   // midday
    if (h >= 16 && h < 19) return 3;  // sunset
    if (h >= 19 && h < 21) return 4;  // twilight
    return 5;                          // midnight (21:00–04:00) — matches Setup's hourToPhase
  }
  var phase = cfg.followDay ? phaseFromClock() : (cfg.phase | 0);

  // occluders are position-specific (lab refreshFG, ~292-296). Depth-toggle and hourglass-toggle dropped —
  // neither exists in session v1 (no settings UI yet, hourglass always in-scene) — occlusion is just always on.
  function refreshFG() {
    var place = S.dataset.place;
    document.querySelector('.fg-glass').classList.add('active');
    document.querySelector('.fg-horizon').classList.toggle('active', place === 'horizon');
    document.querySelector('.fg-ledge').classList.remove('active');   // Ledge: numbers rest ON the ledge (no depth)
  }

  // locked per-mode geometry (lab LOCKED, ~382-387) — byte-for-byte site/js/timer-modes.json / web-prototype/timer-modes.json
  var LOCKED = {
    horizon: { xPct: -30, yPct: -4.2,  size: '20', gap: '3cqw',  weight: '550', stretch: '1' },
    middle:  { xPct: 0,   yPct: 4.84,  size: '25', gap: '15cqw', weight: '550', stretch: '1' },
    top:     { xPct: 0,   yPct: -2.59, size: '25', gap: '3cqw',  weight: '550', stretch: '1' },
    ledge:   { xPct: 0,   yPct: 11.96, size: '25', gap: '15cqw', weight: '550', stretch: '1' }
  };
  // lab applyMode (~391-402), minus slider-sync + tuned-preset fallback — no authoring controls in the session
  function applyMode(mode) {
    var p = LOCKED[mode]; if (!p) return;
    var r = S.getBoundingClientRect();
    S.style.setProperty('--num-size', p.size);
    S.style.setProperty('--gap', p.gap);
    S.style.setProperty('--num-weight', p.weight);
    S.style.setProperty('--num-scaleX', p.stretch);
    S.style.setProperty('--dx', (mode === 'horizon' ? p.xPct / 100 * r.width : 0) + 'px');
    S.style.setProperty('--dy', p.yPct / 100 * r.height + 'px');
  }

  // auto-contrast (lab rgbOf/setTone/sampleBg, ~414-438, verbatim — overall-luminance version)
  var bgLuma = 0.5, autoContrast = !!cfg.autoContrast, liftK = 1;
  function rgbOf(c) {
    c = (c || '#ffffff').trim(); var r = 255, g = 255, b = 255;
    if (c[0] === '#') {
      var h = c.slice(1); if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join('');
      r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
    } else { var m = c.match(/\d+/g); if (m) { r = +m[0]; g = +m[1]; b = +m[2]; } }
    return [r, g, b];
  }
  function setTone() {
    var chosen = getComputedStyle(S).getPropertyValue('--num-color').trim();
    if (!autoContrast) { S.style.setProperty('--num-eff', chosen); return; }
    var rgb = rgbOf(chosen), r = rgb[0], g = rgb[1], b = rgb[2];
    var cL = (0.299 * r + 0.587 * g + 0.114 * b) / 255, t = 0;
    if (cL < 0.5) {                                     // dark colour: lift toward white on DARK scenes only
      var s = Math.min(1, Math.max(0, (0.46 - bgLuma) / 0.08));
      var targetL = cL + (0.9 - cL) * s;
      t = Math.min(1, ((targetL - cL) / (1 - cL)) * liftK);
    }
    r = r + (255 - r) * t; g = g + (255 - g) * t; b = b + (255 - b) * t;
    S.style.setProperty('--num-eff', 'rgb(' + Math.round(r) + ' ' + Math.round(g) + ' ' + Math.round(b) + ')');
  }
  function sampleBg() {                                 // OVERALL plate luminance (day vs night) — same for all modes
    var img = new Image();
    img.onload = function () {
      var W = 48, H = 27, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W, H);
      try {
        var d = g.getImageData(0, 0, W, H).data, sum = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
        bgLuma = n ? sum / n / 255 : 0.5;
      } catch (e) { bgLuma = 0.5; }
      setTone();
    };
    img.onerror = function () { setTone(); };
    img.src = withHG(phase);
  }

  // per-mode separator (lab applySepForMode, ~440-444, verbatim). The chip-list update is authoring UI that
  // doesn't exist yet (Task 7) — querySelectorAll returns an empty NodeList now, so forEach already no-ops.
  function applySepForMode(mode) {
    var noSep = (mode === 'middle' || mode === 'ledge');
    if (noSep) S.dataset.sep = 'none'; else if (S.dataset.sep === 'none') S.dataset.sep = 'colon';
    document.querySelectorAll('[data-seg="sep"] button').forEach(function (c) {
      var isNone = c.dataset.v === 'none';
      c.disabled = noSep ? !isNone : isNone;
      c.classList.toggle('on', c.dataset.v === S.dataset.sep);
    });
  }

  // wiring (brief Steps 1-2): the locked look for cfg, then phase-driven plate + occluders
  function applyLook(cfg) {
    S.dataset.place = cfg.place;
    S.dataset.sep = cfg.sep;
    S.dataset.fill = cfg.fill || 'solid';
    S.style.setProperty('--num-font', cfg.font);
    S.style.setProperty('--num-color', cfg.color);
    applyMode(cfg.place);
    S.dataset.vis = cfg.vis;
  }

  setPlate();
  applyLook(cfg);
  refreshFG();
  applySepForMode(cfg.place);

  // ================= ⚙ SETTINGS PANEL (Task 7) =================
  // Persist: every control updates cfg.<field> → its apply fn → saveCfg().
  function saveCfg(){ localStorage.setItem('sustain.session', JSON.stringify(cfg)); }

  // ---- Audio engine: ported from setup.html (~L659-965). The audio GRAPH (K-weighted gains,
  //      masking-duck, brickwall limiter, crossfade-stacking gapless loop) is copied VERBATIM — the
  //      founder tuned it, not re-derived here. Only the DOM bindings are rewired to this settings
  //      sheet, and Setup's preview-gating is REMOVED: in-session, sound plays LIVE once the
  //      AudioContext is unlocked on the first user gesture. cfg.sounds / cfg.vol feed initial state.
  var SOUNDS=[
    {id:'sand',  label:'Sand',        on:0},
    {id:'ocean', label:'Ocean',       on:0},
    {id:'breeze',label:'Shore breeze',on:0},
    {id:'birds', label:'Seabirds',    on:0}
  ];
  SOUNDS.forEach(function(s){ s.on = (cfg.sounds||[]).indexOf(s.id)>=0 ? 1 : 0; });   // seed from cfg.sounds
  var masterPos = (cfg.vol==null?100:cfg.vol), unlocked=false;
  var breakDuck = 1, BREAK_DUCK = 0.15;    // ambient hushes to 15% during a break/rest, full during focus (tunable)
  function gainFor(){ return Math.pow((masterPos/100),2.5); }   // audio taper, one master level

  var tokensEl=document.getElementById('tokens'), mixRowsEl=document.getElementById('mixRows'),
      volEl=document.getElementById('vol'), volPctEl=document.getElementById('volPct');
  // 4 sound toggles rendered as Setup chips (data-on → .chip.on)
  function renderTokens(){
    tokensEl.innerHTML = SOUNDS.map(function(s){
      return '<button class="chip'+(s.on?' on':'')+'" data-snd="'+s.id+'">'+s.label+'</button>';
    }).join('');
  }
  tokensEl.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    var s=SOUNDS.filter(function(x){return x.id===b.dataset.snd;})[0];
    s.on = s.on?0:1; b.classList.toggle('on', !!s.on);
    cfg.sounds = SOUNDS.filter(function(x){return x.on;}).map(function(x){return x.id;});
    saveCfg(); renderMixRows(); syncAudio();          // toggle → start/stop that sound live
  });
  // ── Per-sound mixer (setup ~L695-710) — only SELECTED sounds, each at its set volume ──
  function renderMixRows(){
    var on=SOUNDS.filter(function(s){ return s.on; });
    mixRowsEl.innerHTML = on.length ? on.map(function(s){
      var v=SOUND_VOL[s.id]==null?100:SOUND_VOL[s.id];
      return '<div class="mix-row"><span class="mr-k">'+s.label+'</span>'
        +'<input type="range" min="0" max="100" value="'+v+'" data-mix="'+s.id+'" style="--fill:'+v+'%" aria-label="'+s.label+' volume">'
        +'<span class="mr-v" data-mixv="'+s.id+'">'+v+'%</span></div>';
    }).join('') : '<div class="mix-empty">No sounds on — pick one above first.</div>';
  }
  mixRowsEl.addEventListener('input',function(e){
    var r=e.target.closest('[data-mix]'); if(!r) return;
    var id=r.dataset.mix, v=+r.value;
    SOUND_VOL[id]=v; r.style.setProperty('--fill',v+'%');
    document.querySelector('[data-mixv="'+id+'"]').textContent=v+'%';
    applyVol(id); cfg.soundVol[id]=v; saveCfg();
  });
  volEl.addEventListener('input',function(e){
    masterPos=+e.target.value; volPctEl.textContent=masterPos+'%';
    e.target.style.setProperty('--fill',masterPos+'%');
    cfg.vol=masterPos; saveCfg(); syncAudio();        // → engine master
  });

  // ── Audio engine core — VERBATIM from setup.html (~L745-943) ──
  var AUDIO_FILE={ sand:'sand.m4a', ocean:'ocean.mp3', breeze:'breeze.mp3', birds:'birds.mp3' };
  var LOOP_POINTS={ sand:[0.15,13.20], ocean:[0.35,70.0], breeze:[0.35,97.846], birds:[0.0,22.5] };
  var SOUND_GAIN={ sand:26, ocean:2.2, breeze:0.40, birds:8.0 };   // sand trimmed a touch (was 30)
  var SOUND_VOL={ sand:100, ocean:100, breeze:100, birds:100 };   // user 0-100 per sound
  // persist per-sound volumes via cfg.soundVol; older saved configs won't have it, and a partial
  // map is safe — per-key-default any missing sound to 100.
  cfg.soundVol = cfg.soundVol || { sand:100, ocean:100, breeze:100, birds:100 };
  SOUNDS.forEach(function(s){ SOUND_VOL[s.id] = cfg.soundVol[s.id]==null ? 100 : cfg.soundVol[s.id]; });
  var DUCK={ breeze:{ ocean:0.60 } };   // sand's ocean-duck is now a LIVE sidechain (envelope-follows the waves), not a static value
  var sandDuck=null, oceanTap=null, scRAF=null;   // sand duck-gain node + ocean envelope tap + follower rAF handle
  // Tunables: ocean RMS mapped lo..hi -> duck depth (max reduction), with smoothing. Loud crest ducks sand,
  // a lull lets it rise — so the variation tracks the waves instead of a fixed suppression.
  var SC_LO=0.02, SC_HI=0.13, SC_DEPTH=0.72, SC_SMOOTH=0.05;
  function isOn(id){ for(var i=0;i<SOUNDS.length;i++) if(SOUNDS[i].id===id) return !!SOUNDS[i].on; return false; }
  function duckFactor(id){ var d=DUCK[id], f=1; if(d) for(var k in d) if(isOn(k)) f*=d[k]; return f; }
  function userMult(id){ return Math.pow((SOUND_VOL[id]==null?100:SOUND_VOL[id])/100, 2.5); }
  function baseGain(id){ return (SOUND_GAIN[id]||1)*userMult(id)*duckFactor(id); }   // calibrated x user x duck
  var TONE_HZ={ breeze:10870, sand:16970, birds:10853, ocean:19450 };
  var LOWPASS_HZ={ sand:12000, ocean:16000, breeze:9000, birds:9000 };
  var HIGHPASS_HZ={ birds:220 };
  var BIRD_TIDE=[1.0, 0.06, 12];
  var AC=null, master=null, A={};                             // A[id] = {buffer, src, gain, dead}

  function ensureAudio(){
    if(AC) return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    sharedCtx = AC;                                           // Task 6 contract: softCue() shares this ctx
    if(!cueBuffer) fetch('assets/audio/cue_bell.mp3?v=1').then(function(r){return r.arrayBuffer();})  // ritual bell
      .then(function(b){ return AC.decodeAudioData(b); }).then(function(buf){ cueBuffer=buf; }).catch(function(){});
    var lim=AC.createDynamicsCompressor();
    lim.threshold.value=-1.5; lim.knee.value=0; lim.ratio.value=20;
    lim.attack.value=0.003; lim.release.value=0.15;
    master=AC.createGain(); master.gain.value=0;
    master.connect(lim); lim.connect(AC.destination);
  }
  function fileFor(id){ return 'assets/audio/'+(AUDIO_FILE[id]||id+'.mp3'); }   // relative — matches session's asset paths
  function loadBuffer(id){
    var n=A[id]=A[id]||{};
    if(n.buffer) return Promise.resolve(n.buffer);
    if(n.dead)   return Promise.resolve(null);               // file not sourced yet — skip quietly
    if(n.loading) return n.loading;
    n.loading=fetch(fileFor(id))
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(function(b){ return AC.decodeAudioData(b); })
      .then(function(buf){ n.buffer=buf; n.loading=null; return buf; })
      .catch(function(){ n.dead=true; n.loading=null; return null; });  // missing file must not break the rest
    return n.loading;
  }
  function filterChain(id,from){
    var tail=from, made=[];
    if(TONE_HZ[id]){
      [ [TONE_HZ[id],8,-30], [TONE_HZ[id],20,-24] ].forEach(function(p){   // wide + narrow
        var b=AC.createBiquadFilter(); b.type='peaking';
        b.frequency.value=p[0]; b.Q.value=p[1]; b.gain.value=p[2];
        tail.connect(b); tail=b; made.push(b);
      });
    }
    if(HIGHPASS_HZ[id]){
      for(var h=0;h<2;h++){
        var hpf=AC.createBiquadFilter(); hpf.type='highpass';
        hpf.frequency.value=HIGHPASS_HZ[id]; hpf.Q.value=0.707;
        tail.connect(hpf); tail=hpf; made.push(hpf);
      }
    }
    for(var i=0;i<2;i++){                                        // 2 poles = 24 dB/oct
      var l=AC.createBiquadFilter(); l.type='lowpass';
      l.frequency.value=(LOWPASS_HZ[id]||9000); l.Q.value=0.707;
      tail.connect(l); tail=l; made.push(l);
    }
    return { tail:tail, nodes:made };
  }
  function attachBirdTide(n){
    var p=BIRD_TIDE, G=baseGain('birds');
    n.bus.gain.value=(p[0]+p[1])/2*G;
    n.lfo=AC.createOscillator(); n.lfo.type='sine'; n.lfo.frequency.value=1/p[2];
    n.lfoGain=AC.createGain(); n.lfoGain.gain.value=(p[0]-p[1])/2*G;
    n.lfo.connect(n.lfoGain); n.lfoGain.connect(n.bus.gain);   // adds to the bus level
    n.lfo.start();
  }
  function applyVol(id){
    var n=A[id]; if(!n||!n.bus) return;
    var t=AC.currentTime;
    if(id==='birds'){
      var p=BIRD_TIDE, G=baseGain('birds');
      n.bus.gain.setTargetAtTime((p[0]+p[1])/2*G, t, 0.08);
      if(n.lfoGain) n.lfoGain.gain.setTargetAtTime((p[0]-p[1])/2*G, t, 0.08);
    } else {
      n.bus.gain.setTargetAtTime(baseGain(id), t, 0.08);
    }
  }
  var XFADE={ sand:0.4, ocean:4.0, breeze:4.0, birds:5.0 };
  var WIN_N=512;
  function sineWindow(scale){
    var w=new Float32Array(WIN_N);
    for(var i=0;i<WIN_N;i++) w[i]=scale*Math.sin(Math.PI*i/(WIN_N-1));
    w[0]=w[WIN_N-1]=0.0001;
    return w;
  }
  var FADE_N=64, FADE_IN=new Float32Array(FADE_N), FADE_OUT=new Float32Array(FADE_N);
  (function(){ for(var i=0;i<FADE_N;i++){ var th=i/(FADE_N-1)*Math.PI/2;
      FADE_IN[i]=Math.sin(th); FADE_OUT[i]=Math.cos(th); } })();
  function pumpLoop(id){
    var n=A[id]; if(!n||!n.seg) return;
    var horizon=AC.currentTime+1.2;                          // schedule a little ahead
    while(n.next<horizon){
      var t=n.next, S=n.seg;                                 // (local S = segment; shadows scene S, unused here)
      var src=AC.createBufferSource(); src.buffer=n.buffer;
      var g=AC.createGain();
      if(S.win){
        g.gain.setValueCurveAtTime(S.win,t,S.d);             // one sine window over the pass
      } else {
        g.gain.setValueCurveAtTime(FADE_IN,t,S.xf);          // in
        g.gain.setValueCurveAtTime(FADE_OUT,t+S.d-S.xf,S.xf);// out (holds at 1 between)
      }
      src.connect(g); g.connect(n.bus);
      src.start(t,S.s,S.d+0.02); src.stop(t+S.d+0.02);
      (function(a,b){ a.onended=function(){ try{ a.disconnect(); b.disconnect(); }catch(e){} }; })(src,g);
      n.live.push(src); if(n.live.length>8) n.live.shift();
      n.next = t + S.hop;                                    // next pass starts here
    }
  }
  function startSound(id){
    var n=A[id]=A[id]||{};
    if(!n.buffer||n.bus) return;
    var lp=LOOP_POINTS[id]||[0,n.buffer.duration];
    var d=lp[1]-lp[0];
    n.bus=AC.createGain(); n.bus.gain.value=baseGain(id);
    if(id==='birds') attachBirdTide(n);                       // level rides a slow tide
    var ch=filterChain(id,n.bus); n.chain=ch;
    if(id==='sand'){                                          // insert a duck-gain the ocean sidechain modulates
      sandDuck=AC.createGain(); sandDuck.gain.value=1;
      ch.tail.connect(sandDuck); sandDuck.connect(master);
    } else { ch.tail.connect(master); }
    if(id==='ocean'){                                         // passive tap for the envelope follower
      oceanTap=AC.createAnalyser(); oceanTap.fftSize=256; oceanTap.smoothingTimeConstant=0.3;
      ch.tail.connect(oceanTap);
    }
    startSidechain();                                         // (re)arm when either sand or ocean starts
    var spec=XFADE[id]||2;
    if(spec<=1){
      n.seg={ s:lp[0], d:d, hop:d*spec, win:sineWindow(Math.sqrt(2*spec)) };
    } else {
      var xf=Math.min(spec, d/2);
      n.seg={ s:lp[0], d:d, hop:d-xf, xf:xf };
    }
    n.next=AC.currentTime+0.06; n.live=[];
    n.pump=setInterval(function(){ pumpLoop(id); },300);
    pumpLoop(id);
  }
  function stopSound(id){
    var n=A[id]; if(!n||!n.bus) return;
    clearInterval(n.pump); n.pump=null;
    if(n.lfo){ try{ n.lfo.stop(); n.lfo.disconnect(); n.lfoGain.disconnect(); }catch(e){}   // bird tide
               n.lfo=null; n.lfoGain=null; }
    (n.live||[]).forEach(function(s){ try{ s.stop(); s.disconnect(); }catch(e){} });
    if(id==='sand' && sandDuck){ try{ sandDuck.disconnect(); }catch(e){} sandDuck=null; }
    if(id==='ocean'){ oceanTap=null; if(sandDuck) sandDuck.gain.setTargetAtTime(1, AC.currentTime, 0.12); }  // ocean gone -> sand rises back
    try{ n.bus.disconnect(); }catch(e){}
    if(n.chain) n.chain.nodes.forEach(function(f){ try{ f.disconnect(); }catch(e){} });
    n.bus=null; n.chain=null; n.seg=null; n.live=null;
  }
  // Sand-under-ocean SIDECHAIN: an envelope-follower on the ocean tap ducks the sand duck-gain in real time,
  // so sand recedes on each wave crest and rises in each lull — natural, not a fixed suppression.
  function startSidechain(){ if(scRAF==null) sidechainTick(); }
  function sidechainTick(){
    if(sandDuck && oceanTap){
      var buf=new Float32Array(oceanTap.fftSize); oceanTap.getFloatTimeDomainData(buf);
      var s=0; for(var i=0;i<buf.length;i++) s+=buf[i]*buf[i];
      var rms=Math.sqrt(s/buf.length);
      var x=Math.max(0,Math.min(1,(rms-SC_LO)/(SC_HI-SC_LO)));
      sandDuck.gain.setTargetAtTime(1 - x*SC_DEPTH, AC.currentTime, SC_SMOOTH);   // loud ocean -> duck sand toward (1-DEPTH)
      scRAF=requestAnimationFrame(sidechainTick);
    } else { scRAF=null; }                                    // one side stopped -> pause the follower
  }
  // live mix — start/stop wanted sounds, re-balance ducking, ramp master (setup ~L944-965, preview-gate removed)
  function syncAudio(){
    if(!unlocked) return;                       // autoplay policy: no context before the first user gesture
    ensureAudio();
    if(AC.state==='suspended') AC.resume();
    var wanted=SOUNDS.filter(function(s){ return s.on; }).map(function(s){ return s.id; });
    Promise.all(wanted.map(loadBuffer)).then(function(){
      SOUNDS.forEach(function(s){ if(s.on) startSound(s.id); else stopSound(s.id); });
      SOUNDS.forEach(function(s){ if(s.on) applyVol(s.id); });   // ducking glides in/out live
      var t=AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(gainFor()*breakDuck, t, 0.08);   // click-free ramp (breakDuck hushes ambient during rests)
    });
  }
  // autoplay unlock — create/resume the AudioContext on the first gesture, then start cfg.sounds live
  function unlock(){
    if(unlocked) return; unlocked=true;
    ensureAudio(); if(AC.state==='suspended') AC.resume();
    syncAudio();
  }
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);
  window.addEventListener('touchstart', unlock, { passive:true });

  // ---- Sheet open/close ----
  var setSheet=document.getElementById('setSheet'), setScrim=document.getElementById('setScrim');
  document.getElementById('gear').addEventListener('click', function(){
    setScrim.classList.add('open'); setSheet.classList.add('open');
  });
  function closeSheet(){ setScrim.classList.remove('open'); setSheet.classList.remove('open'); }
  setScrim.addEventListener('click', closeSheet);
  document.getElementById('setClose').addEventListener('click', closeSheet);

  // ---- Scene phase chips — the one place chips stay (6 uneven-length manual values; see research doc).
  //      Only visible when Follow my day is Off. ----
  // ---- Scene: Setup-style Time-of-day image grid (Follow my day + 6 phase thumbnails) ----
  var TOD=[{id:'pre-dawn',cap:'Pre-dawn',pos:'50% 42%'},{id:'sunrise',cap:'Sunrise',pos:'50% 40%'},
           {id:'midday',cap:'Midday',pos:'50% 38%'},{id:'sunset',cap:'Sunset',pos:'50% 42%'},
           {id:'twilight',cap:'Twilight',pos:'50% 44%'},{id:'midnight',cap:'Midnight',pos:'50% 46%'}];
  var todEl=document.getElementById('tod');
  function renderTod(){
    var h='<button type="button" class="todo'+(cfg.followDay?' on':'')+'" data-tod="follow">'
      +'<span class="dot follow"></span><span class="cap">Follow my day</span></button>';
    h+=TOD.map(function(p,i){ return '<button type="button" class="todo'+(!cfg.followDay&&(cfg.phase|0)===i?' on':'')+'" data-tod="'+i+'">'
      +'<span class="dot" style="background-image:url(assets/plates/'+p.id+'.jpg);background-position:'+p.pos+'"></span>'
      +'<span class="cap">'+p.cap+'</span></button>'; }).join('');
    todEl.innerHTML=h;
  }
  todEl.addEventListener('click', function(e){
    var b=e.target.closest('.todo'); if(!b) return;
    if(b.dataset.tod==='follow'){ cfg.followDay=true; phase=phaseFromClock(); }
    else { cfg.followDay=false; cfg.phase=+b.dataset.tod; phase=+b.dataset.tod; }
    setPlate(); saveCfg(); renderTod();
  });
  renderTod();

  // ---- Mini-segments: every compact control (Timer visibility, Placement, Fill, Font, Separator,
  //      Follow my day, Auto-contrast) — the ONE toggle-row language, ported off the old chip delegate. ----
  setSheet.querySelectorAll('.mini-seg').forEach(function(seg){
    seg.addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b||b.disabled) return;
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
      var v=b.dataset.v, name=seg.dataset.seg;
      if(name==='vis'){ cfg.vis=v; S.dataset.vis=v; }
      else if(name==='auto'){ autoContrast=(v==='on'); cfg.autoContrast=autoContrast; setTone(); }
      else if(name==='place'){ cfg.place=v; applyLook(cfg); refreshFG(); applySepForMode(cfg.place); }
      else if(name==='fill'){ cfg.fill=v; applyLook(cfg); }
      else if(name==='font'){ cfg.font=v; applyLook(cfg); }
      else if(name==='sep'){ cfg.sep=v; S.dataset.sep=v; applySepForMode(cfg.place); }   // per-mode rule enforced
      saveCfg();
    });
  });

  // ---- Colour: preset swatches + custom picker ----
  var colorPick=document.getElementById('colorPick');
  var swatchesEl=document.getElementById('swatches');
  function reflectColor(){ swatchesEl.querySelectorAll('.sw-c[data-c]').forEach(function(b){
    b.classList.toggle('on', b.dataset.c.toLowerCase()===String(cfg.color||'').toLowerCase()); }); }
  function setColor(c){ cfg.color=c; colorPick.value=c; applyLook(cfg); setTone(); saveCfg(); reflectColor(); }
  colorPick.value = cfg.color || '#ffffff';
  swatchesEl.addEventListener('click', function(e){ var b=e.target.closest('.sw-c[data-c]'); if(b) setColor(b.dataset.c); });
  colorPick.addEventListener('input', function(){ setColor(colorPick.value); });
  reflectColor();

  // ---- Reflect current cfg on the controls (initial state) ----
  renderTokens();
  volEl.value=masterPos; volPctEl.textContent=masterPos+'%'; volEl.style.setProperty('--fill',masterPos+'%');
  renderMixRows();
  function selSeg(name,val){ setSheet.querySelectorAll('.mini-seg[data-seg="'+name+'"] button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===val); }); }
  selSeg('vis', cfg.vis); selSeg('auto', autoContrast?'on':'off');
  selSeg('place', cfg.place); selSeg('font', cfg.font); selSeg('fill', cfg.fill || 'solid'); selSeg('sep', cfg.sep);
  applySepForMode(cfg.place);   // final authority on sep button enable/disable + on-state for the current mode
})();
</script>
</body>
</html>
